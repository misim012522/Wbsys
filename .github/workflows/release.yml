name: Create Release

on:
  push:
    tags:
      - 'v*'   # triggers when you push v1.0.0

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # OPTIONAL: auto create zip (recommended)
      - name: Create ZIP
        run: |
          zip -r Wbsys-${{ github.ref_name }}.zip . -x "*.git*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Wbsys-${{ github.ref_name }}.zip
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}